<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7f2e9">
  <title>QLIC Compression Demo</title>
  <style>
    :root {
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      color: #173126;
      background: #e7f2e9;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -20%, #f8fcf9 0, transparent 42rem),
        #e7f2e9;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .page {
      width: min(860px, calc(100% - 40px));
      margin: 0 auto;
      padding: 52px 0 64px;
    }

    .intro {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 6vw, 3rem);
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #527064;
      font-size: 1rem;
    }

    .card {
      border: 1px solid #c7dbce;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 16px 44px rgba(45, 79, 61, 0.07);
    }

    .input-card {
      padding: 20px;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .input-card.dragging {
      border-color: #5b8a70;
      background: #fbfefc;
    }

    .label {
      margin: 0 0 11px;
      color: #37624d;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.075em;
    }

    .picker-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
    }

    .file-field {
      display: flex;
      min-width: 0;
      min-height: 46px;
      align-items: center;
      padding: 0 14px;
      overflow: hidden;
      border: 1px solid #d8e6dc;
      border-radius: 10px;
      background: #f3f8f4;
      color: #49665a;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .file-field.has-file {
      color: #173126;
    }

    .button {
      min-height: 46px;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease,
        color 140ms ease, transform 80ms ease;
    }

    .button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .button:focus-visible,
    .input-card:focus-visible {
      outline: 3px solid rgba(61, 115, 85, 0.24);
      outline-offset: 2px;
    }

    .secondary {
      border: 1px solid #bdd3c5;
      background: #f8fcf9;
      color: #28543e;
    }

    .secondary:hover:not(:disabled) {
      border-color: #7fa68e;
      background: #ffffff;
    }

    .primary {
      background: #4f7e65;
      color: #ffffff;
      font-weight: 600;
    }

    .primary:hover:not(:disabled) {
      background: #426e58;
    }

    .button:disabled {
      cursor: default;
      opacity: 0.48;
    }

    .input-details {
      min-height: 22px;
      margin: 10px 0 0;
      color: #607a6e;
      font-size: 0.875rem;
    }

    .actions {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .status {
      margin: 0;
      color: #527064;
      font-size: 0.9rem;
    }

    .status.error {
      color: #9b3f3f;
    }

    .progress {
      height: 3px;
      overflow: hidden;
      border-radius: 99px;
      background: #d5e6da;
      opacity: 0;
    }

    .progress.visible {
      opacity: 1;
    }

    .progress::after {
      display: block;
      width: 36%;
      height: 100%;
      border-radius: inherit;
      background: #5d8d72;
      content: "";
      animation: progress 1s ease-in-out infinite;
    }

    @keyframes progress {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(310%);
      }
    }

    .result-card {
      min-height: 218px;
      padding: 20px;
    }

    .result-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }

    .result {
      margin: 4px 0 0;
      font-size: clamp(2rem, 7vw, 2.75rem);
      font-weight: 640;
      letter-spacing: -0.04em;
    }

    .result.placeholder {
      color: #8aa095;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0;
    }

    .details {
      display: grid;
      grid-template-columns: auto auto;
      width: max-content;
      max-width: 100%;
      gap: 5px 22px;
      margin: 22px 0 0;
      color: #49665a;
      font-size: 0.9rem;
    }

    .details dt,
    .details dd {
      margin: 0;
    }

    .details dd {
      color: #173126;
      text-align: right;
    }

    .hidden {
      display: none;
    }

    #file {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 24px, 860px);
        padding-top: 34px;
      }

      .picker-row,
      .result-layout {
        grid-template-columns: 1fr;
      }

      .picker-row .button,
      .actions .button,
      .result-layout .button {
        width: 100%;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
        padding: 14px 0;
      }

      .status {
        min-height: 20px;
      }

      .result-card {
        min-height: 260px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .input-card {
        transition: none;
      }

      .progress::after {
        animation-duration: 2.5s;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>QLIC Demo</h1>
      <p class="subtitle">QLIC Image Compression Demo</p>
    </header>

    <section
      id="dropZone"
      class="card input-card"
      tabindex="0"
      aria-label="Choose or drop an image"
    >
      <p class="label">IMAGE</p>
      <div class="picker-row">
        <div id="fileName" class="file-field">No image selected</div>
        <button id="choose" class="button secondary" type="button">
          Choose image
        </button>
      </div>
      <p id="inputDetails" class="input-details">
        Drop an image here or choose one
      </p>
      <input
        id="file"
        type="file"
        accept="image/*,.jxl,.avif,.tif,.tiff,.bmp"
      >
    </section>

    <div class="actions">
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="compress" class="button primary" type="button" disabled>
        Compress with QLIC
      </button>
    </div>

    <div id="progress" class="progress" aria-hidden="true"></div>

    <section class="card result-card">
      <p class="label">QLIC RESULT</p>
      <div class="result-layout">
        <div>
          <p id="result" class="result placeholder">No result yet</p>
          <dl id="details" class="details hidden">
            <dt>Original file</dt>
            <dd id="originalSize"></dd>
            <dt>QLIC file</dt>
            <dd id="qlicSize"></dd>
            <dt>Encode time</dt>
            <dd id="encodeTime"></dd>
          </dl>
        </div>
        <button id="save" class="button secondary" type="button" disabled>
          Save QLIC
        </button>
      </div>
    </section>
  </main>

  <script type="module">
    const fileInput = document.getElementById("file");
    const chooseButton = document.getElementById("choose");
    const compressButton = document.getElementById("compress");
    const saveButton = document.getElementById("save");
    const dropZone = document.getElementById("dropZone");
    const fileName = document.getElementById("fileName");
    const inputDetails = document.getElementById("inputDetails");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const result = document.getElementById("result");
    const details = document.getElementById("details");
    const originalSize = document.getElementById("originalSize");
    const qlicSize = document.getElementById("qlicSize");
    const encodeTime = document.getElementById("encodeTime");
    let source = null;
    let output = null;
    let busy = false;
    let nextJob = 1;
    let activeJob = null;
    let worker = null;

    const formatSize = bytes => {
      if (bytes < 1024) return `${bytes} bytes`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    };

    const outputName = name => {
      const dot = name.lastIndexOf(".");
      const base = dot > 0 ? name.slice(0, dot) : name;
      return `${base || "image"}.qlic`;
    };

    const setStatus = (message, error = false) => {
      status.textContent = message;
      status.classList.toggle("error", error);
    };

    const resetResult = () => {
      output = null;
      result.textContent = "No result yet";
      result.classList.add("placeholder");
      details.classList.add("hidden");
      saveButton.disabled = true;
    };

    const setBusy = value => {
      busy = value;
      chooseButton.disabled = value;
      compressButton.disabled = value || !source;
      saveButton.disabled = value || !output;
      compressButton.textContent = value
        ? "Compressing..."
        : "Compress with QLIC";
      progress.classList.toggle("visible", value);
    };

    const readU32 = (bytes, offset) =>
      bytes[offset] |
      bytes[offset + 1] << 8 |
      bytes[offset + 2] << 16 |
      bytes[offset + 3] << 24;

    const knownLossy = async file => {
      const lower = file.name.toLowerCase();
      if (file.type === "image/jpeg" ||
          lower.endsWith(".jpg") ||
          lower.endsWith(".jpeg") ||
          lower.endsWith(".jpe")) {
        return true;
      }
      const bytes = new Uint8Array(
        await file.slice(0, Math.min(file.size, 1024 * 1024)).arrayBuffer()
      );
      if (bytes.length >= 3 &&
          bytes[0] === 0xff &&
          bytes[1] === 0xd8 &&
          bytes[2] === 0xff) {
        return true;
      }
      if (bytes.length < 20 ||
          String.fromCharCode(...bytes.subarray(0, 4)) !== "RIFF" ||
          String.fromCharCode(...bytes.subarray(8, 12)) !== "WEBP") {
        return false;
      }
      let offset = 12;
      while (offset + 8 <= bytes.length) {
        const tag = String.fromCharCode(...bytes.subarray(offset, offset + 4));
        const size = readU32(bytes, offset + 4) >>> 0;
        if (tag === "VP8 ") return true;
        if (tag === "VP8L") return false;
        const next = offset + 8 + size + (size & 1);
        if (next <= offset || next > bytes.length) break;
        offset = next;
      }
      return false;
    };

    const decodeWithLauncher = async file => {
      if (location.hostname !== "127.0.0.1")
        throw new Error("The source image could not be decoded.");
      let response;
      try {
        response = await fetch("/decode", {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream" },
          body: file,
          cache: "no-store"
        });
      } catch {
        throw new Error("The source image could not be decoded.");
      }
      if (!response.ok) {
        const detail = (await response.text()).trim();
        if (!detail)
          throw new Error("The source image could not be decoded.");
        const message = detail[0].toUpperCase() + detail.slice(1);
        throw new Error(/[.!?]$/.test(message) ? message : `${message}.`);
      }
      const width = Number(response.headers.get("X-QLIC-Width"));
      const height = Number(response.headers.get("X-QLIC-Height"));
      if (!Number.isInteger(width) || !Number.isInteger(height) ||
          width < 1 || height < 1 ||
          width * height > 33554432) {
        throw new Error("The source image dimensions are invalid.");
      }
      const pixels = new Uint8Array(await response.arrayBuffer());
      if (pixels.length !== width * height * 4)
        throw new Error("The source image pixels are invalid.");
      return { file, width, height, pixels };
    };

    const decodeImage = async file => {
      let bitmap;
      try {
        bitmap = await createImageBitmap(file, {
          imageOrientation: "from-image",
          premultiplyAlpha: "none"
        });
      } catch {
        try {
          bitmap = await createImageBitmap(file);
        } catch {
          return decodeWithLauncher(file);
        }
      }
      try {
        if (!bitmap.width || !bitmap.height ||
            bitmap.width * bitmap.height > 33554432) {
          throw new Error("This image is too large for the browser demo.");
        }
        const canvas = document.createElement("canvas");
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        const context = canvas.getContext("2d", {
          alpha: true,
          willReadFrequently: true
        });
        if (!context) throw new Error("The browser could not read this image.");
        context.drawImage(bitmap, 0, 0);
        const image = context.getImageData(0, 0, bitmap.width, bitmap.height);
        return {
          file,
          width: bitmap.width,
          height: bitmap.height,
          pixels: new Uint8Array(image.data)
        };
      } finally {
        bitmap.close();
      }
    };

    const selectFile = async file => {
      if (!file || busy) return;
      source = null;
      resetResult();
      compressButton.disabled = true;
      fileName.textContent = file.name;
      fileName.classList.add("has-file");
      inputDetails.textContent = "Reading image...";
      setStatus("");
      try {
        if (!file.size || file.size > 268435456)
          throw new Error("This file is too large for the browser demo.");
        if (file.name.toLowerCase().endsWith(".qlic"))
          throw new Error("Choose an image rather than a QLIC file.");
        if (await knownLossy(file))
          throw new Error("This image is known to be lossy, so it was not accepted.");
        source = await decodeImage(file);
        inputDetails.textContent =
          `${source.width} × ${source.height}, original file ${formatSize(file.size)}`;
        compressButton.disabled = false;
        setStatus("Ready");
      } catch (error) {
        inputDetails.textContent = "The image could not be prepared.";
        setStatus(error.message || String(error), true);
      }
    };

    const disposeWorker = () => {
      const current = worker;
      worker = null;
      if (current) current.terminate();
    };

    const workerFailed = () => {
      disposeWorker();
      if (!activeJob) return;
      const job = activeJob;
      activeJob = null;
      job.reject(new Error(
        location.protocol === "file:"
          ? "Open the demo with Start Demo.cmd before compressing."
          : "The browser compression worker stopped."
      ));
    };

    const getWorker = () => {
      if (worker) return worker;
      try {
        worker = new Worker(
          new URL("./qlic-worker.js", import.meta.url),
          { type: "module" }
        );
      } catch {
        throw new Error(
          location.protocol === "file:"
            ? "Open the demo with Start Demo.cmd before compressing."
            : "The browser compression worker could not start."
        );
      }
      worker.addEventListener("message", event => {
        if (!activeJob || event.data.id !== activeJob.id) return;
        const job = activeJob;
        activeJob = null;
        disposeWorker();
        if (event.data.ok) {
          job.resolve({
            bytes: new Uint8Array(event.data.encoded),
            elapsed: event.data.elapsed
          });
        } else {
          job.reject(new Error(event.data.error || "Compression failed."));
        }
      });
      worker.addEventListener("error", workerFailed);
      return worker;
    };

    window.addEventListener("pagehide", disposeWorker);

    if (location.hostname === "127.0.0.1") {
      // the worker starts on demand, so the hidden launcher stays available
      const keepLauncherOpen = () => {
        fetch("/heartbeat", {
          method: "POST",
          cache: "no-store",
          keepalive: true
        }).catch(() => {});
      };
      keepLauncherOpen();
      setInterval(keepLauncherOpen, 30000);
    }

    const encode = image => new Promise((resolve, reject) => {
      const id = nextJob++;
      activeJob = { id, resolve, reject };
      try {
        const pixels = image.pixels.slice();
        getWorker().postMessage(
          {
            id,
            rgba: pixels.buffer,
            width: image.width,
            height: image.height
          },
          [pixels.buffer]
        );
      } catch (error) {
        activeJob = null;
        reject(error);
      }
    });

    const showResult = encoded => {
      output = encoded.bytes;
      const change = (output.length - source.file.size) * 100 / source.file.size;
      if (change < -0.005)
        result.textContent = `${(-change).toFixed(1)}% smaller`;
      else if (change > 0.005)
        result.textContent = `${change.toFixed(1)}% larger`;
      else
        result.textContent = "Same file size";
      result.classList.remove("placeholder");
      originalSize.textContent = formatSize(source.file.size);
      qlicSize.textContent = formatSize(output.length);
      encodeTime.textContent = `${(encoded.elapsed / 1000).toFixed(2)} seconds`;
      details.classList.remove("hidden");
    };

    chooseButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      selectFile(fileInput.files && fileInput.files[0]);
    });

    compressButton.addEventListener("click", async () => {
      if (!source || busy) return;
      resetResult();
      setBusy(true);
      setStatus("Compressing...");
      try {
        const encoded = await encode(source);
        showResult(encoded);
        setStatus("Compression finished.");
      } catch (error) {
        result.textContent = "Something went wrong";
        result.classList.remove("placeholder");
        setStatus(error.message || "Compression failed.", true);
      } finally {
        setBusy(false);
      }
    });

    saveButton.addEventListener("click", () => {
      if (!output || !source) return;
      const url = URL.createObjectURL(
        new Blob([output], { type: "image/qlic" })
      );
      const link = document.createElement("a");
      link.href = url;
      link.download = outputName(source.file.name);
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      setStatus("QLIC file saved.");
    });

    for (const eventName of ["dragenter", "dragover"]) {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        if (!busy) dropZone.classList.add("dragging");
      });
    }
    for (const eventName of ["dragleave", "drop"]) {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove("dragging");
      });
    }
    dropZone.addEventListener("drop", event => {
      selectFile(event.dataTransfer.files && event.dataTransfer.files[0]);
    });
    dropZone.addEventListener("keydown", event => {
      if ((event.key === "Enter" || event.key === " ") && !busy) {
        event.preventDefault();
        fileInput.click();
      }
    });
  </script>
</body>
</html>
