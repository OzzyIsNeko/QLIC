name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: MSVC
        shell: pwsh
        run: .\build.ps1 -Config Release -BuildDir build\ci-msvc

      - name: WIC registration lifecycle
        shell: pwsh
        run: |
          & '.\tests\wic_registration_test.ps1' `
            -Dll '.\build\ci-msvc\vs18-x64\Release\qlic-wic.dll' `
            -Smoke '.\build\ci-msvc\vs18-x64\Release\qlic-wic-smoke.exe' `
            -Fixture '.\tests\fixtures\rgb-lzms.qlic'

      - name: Clang and sanitizers
        shell: pwsh
        run: |
          .\scripts\build-clang.ps1 -Config Release -BuildDir build\ci-clang
          .\scripts\build-clang.ps1 -Config RelWithDebInfo -BuildDir build\ci-asan -Sanitize

      - name: Rust decoder
        shell: pwsh
        run: .\scripts\build-rust.ps1 -Config Release

      - name: WebAssembly
        shell: pwsh
        run: |
          .\scripts\build-web.ps1 -OutDir build\ci-web
          npm install --prefix '.\build\ci-typescript' --no-save --ignore-scripts typescript@5.9.3
          node '.\build\ci-typescript\node_modules\typescript\lib\tsc.js' --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --lib ES2022,DOM '.\tests\web_types.ts'

      - name: Local packages
        shell: pwsh
        run: .\scripts\package.ps1 -Config Release -BuildDir build\ci-package -CommunityRelease

      - name: Verify package manifests
        shell: pwsh
        run: |
          & '.\tests\verify-packages.ps1' -CommunityRelease
